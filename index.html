<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>태율랜드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Bungee&family=Cinzel:wght@700;900&family=Lilita+One&family=Rye&display=swap" rel="stylesheet">
<style>
/* VOICE: 소셜 카지노 앱 — 화려하고 시끄럽고, 한 판 한 판이 이벤트
   IDEA: 로비에서 기계를 골라 앉는 카지노 홀, 기계마다 다른 세계와 음악
   PICTURE: 로비는 게임 카드 벽, 게임은 테마 프레임 안의 릴이 화면 중앙을 꽉 채움
   COLOUR and TYPE: 게임마다 고유 팔레트(이집트 보라·금, 버팔로 노을, 럭키 레드·크롬, 판다 핑크, 피기 초원) / 테마별 영문 폰트 + Black Han Sans
   LAYOUT: HUD → (잭팟) → 릴 → 조작반, 팝업은 전면 연출 */
:root{color-scheme:dark;--gold:#ffd34d;--gold2:#b8770c;--ink:#fff6dc;--b1:#5a1a9a;--b2:#2a0b52;--b3:#0d0322;--fr:linear-gradient(160deg,#fff3b0,#e0a52a 20%,#8a5408 45%,#f7d66a 60%,#a5650a 85%,#ffe9a0);--reel:linear-gradient(#2b0f4a,#1a0730 50%,#2b0f4a);--box:#12051f;--tfont:Cinzel,serif}
body[data-g=buffalo]{--b1:#ff8a3a;--b2:#8a2a10;--b3:#1a0804;--fr:linear-gradient(160deg,#ffd9a0,#b5651d 25%,#5a2a0a 50%,#d08a3a 70%,#6a3008);--reel:linear-gradient(#3a1a0a,#1e0c04 50%,#3a1a0a);--box:#1a0a03;--tfont:Rye,serif}
body[data-g=lucky]{--b1:#e0203a;--b2:#5a0014;--b3:#120005;--fr:linear-gradient(160deg,#ffffff,#9aa4b5 20%,#4a5262 45%,#e8ecf2 60%,#6a7282 85%,#fff);--reel:linear-gradient(#e9e2d2,#fffdf6 50%,#e9e2d2);--box:#1a1a22;--tfont:Bungee,sans-serif}
body[data-g=panda]{--b1:#ff8fc7;--b2:#8a3fd0;--b3:#24104a;--fr:linear-gradient(160deg,#fff0fa,#ff8fc7 25%,#b03a8a 50%,#ffc2e4 70%,#9a2a7a);--reel:linear-gradient(#ffe6f4,#ffd0ea);--box:#5a1a6a;--tfont:"Lilita One",sans-serif}
body[data-g=dragon]{--b1:#ff3a2a;--b2:#8a0a14;--b3:#2a0306;--fr:linear-gradient(160deg,#fff3b0,#ffcc33 20%,#a8220a 45%,#ffd34d 62%,#8a1408 85%,#ffe9a0);--reel:linear-gradient(#5a0a14,#2a0408 50%,#5a0a14);--box:#1a0204;--tfont:"Lilita One",sans-serif}
body[data-g=tiger]{--b1:#3fa04a;--b2:#0f4a1a;--b3:#041a08;--fr:linear-gradient(160deg,#fff3b0,#e0a52a 20%,#6a3a08 45%,#f7d66a 60%,#3a5a10 85%,#ffe9a0);--reel:linear-gradient(#1a3a14,#0a1f0a 50%,#1a3a14);--box:#061206;--tfont:Rye,serif}
body[data-g=ocean]{--b1:#3ad0ff;--b2:#0a4a9a;--b3:#021230;--fr:linear-gradient(160deg,#e0fbff,#5ad8ff 25%,#0a5aa0 50%,#9af0ff 70%,#063a7a);--reel:linear-gradient(#0a3a6a,#04203f 50%,#0a3a6a);--box:#021226;--tfont:"Lilita One",sans-serif}
body[data-g=piggy]{--b1:#8fdcff;--b2:#2f9a4a;--b3:#0c3414;--fr:linear-gradient(160deg,#f2c28a,#9a5a24 25%,#5a3010 50%,#c8884a 70%,#6a3a14);--reel:linear-gradient(#cfeeff,#eaf8ff 50%,#cfeeff);--box:#3a2010;--tfont:"Lilita One",sans-serif}
*{box-sizing:border-box;min-width:0;-webkit-user-select:none;user-select:none}
html,body{margin:0;min-height:100%}
body{background:var(--b3);color:var(--ink);font:15px/1.4 "Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .4s}
body.fs{--b1:#ff3a1a;--b2:#7a0a14;--b3:#1a0306}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #7fd0ff;outline-offset:2px}
.num{font-family:Cinzel,serif;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.screen{display:none;max-width:760px;margin:0 auto;padding:10px 10px 18px;flex-direction:column;gap:10px}
.screen.on{display:flex}
/* hud */
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:8px;background:linear-gradient(#1a0838,#0b0220);border:2px solid #8a5cd6;border-radius:999px;padding:3px 12px 3px 4px;box-shadow:inset 0 2px 6px #000a;min-height:40px}
.pill .num{font-size:clamp(15px,4.4vw,21px);color:#fff;overflow:hidden;text-overflow:ellipsis}
.cicon{width:30px;height:30px;flex:none}
.lvl{display:flex;flex-direction:column;gap:3px;width:70px}
.lvl b{font-size:12px;color:var(--gold);text-align:center}
.xp{height:8px;border-radius:9px;background:#0007;overflow:hidden;border:1px solid #8a5cd6}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fd4ff,#b56bff);transition:width .4s}
.charge{min-height:44px;padding:0 10px;border-radius:14px;background:linear-gradient(#ffe066,#f5a623 55%,#c16a00);color:#4a1a00;box-shadow:0 4px 0 #7a3b00;font-size:13px;line-height:1.1}
.charge[disabled]{filter:grayscale(.8) brightness(.75);cursor:default}
.charge small{display:block;font-size:11px}
.ib{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7a4cff,#3a138a);border:2px solid var(--gold);display:grid;place-items:center;font-size:18px;box-shadow:0 3px 0 #1a0540;flex:none}
.ib.off{filter:grayscale(1) brightness(.6)}
.hud .ibs{display:flex;gap:6px}
/* lobby */
.logo{text-align:center;margin:6px 0 0}
.logo b{display:block;font:400 clamp(40px,12vw,60px)/1.05 'Black Han Sans',sans-serif;background:linear-gradient(#fff9d0,#ffd34d 45%,#c26a00 70%,#ffe9a0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #5a1a00) drop-shadow(0 0 16px #ff9d0088)}
.logo span{font-size:15px;color:#ffd0ea}
.logo i{font-style:normal;-webkit-text-fill-color:initial;color:initial;display:inline-block;margin-left:6px;font-size:.8em;animation:beat 1s ease-in-out infinite;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;vertical-align:middle}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.love{border-radius:16px;padding:10px 14px;background:linear-gradient(135deg,#ff7ab8,#b04bff);border:2px solid #fff8;box-shadow:0 6px 0 #0006;text-align:left}
.love b{display:flex;justify-content:space-between;font-size:14px;color:#fff}.love em{font-style:normal;color:#ffe066}
.love p{margin:4px 0 0;font-size:17px;color:#fff;text-shadow:0 2px 0 #0004}
.card.wel{background:linear-gradient(160deg,#ffb0da,#ff5aa8 45%,#9a2aff);border-color:#fff}
.wel h3{word-break:keep-all;color:#fff!important;text-shadow:0 3px 0 #a3107a!important;font-size:clamp(28px,8.5vw,40px)!important}
.wel .sig{font-size:16px;color:#fff;margin-top:12px;opacity:.95}
.wel .go{background:linear-gradient(#fff,#ffd0ea)!important;color:#c0106a!important}
.wel .hb{font-size:64px;animation:beat 1s ease-in-out infinite;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.hrain{position:fixed;inset:0;pointer-events:none;z-index:21;overflow:hidden}
.hrain span{position:absolute;top:-10vh;animation:fall linear forwards;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.ticker{display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:14px;padding:6px 14px;background:linear-gradient(#1a0b2e,#05010d);border:2px solid var(--gold);box-shadow:0 0 14px #ffd34d44}
.ticker b{font-family:Cinzel,serif;font-weight:900;color:#ff5252;font-size:14px}
.ticker .num{font-size:clamp(20px,6vw,28px);color:var(--gold);text-shadow:0 0 10px #ffb300}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gcard{position:relative;border-radius:20px;overflow:hidden;min-height:210px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;border:3px solid var(--gold);box-shadow:0 6px 0 #0008,0 10px 24px #000a;transition:transform .12s}
.gcard:active{transform:scale(.97)}
.gcard:first-child{grid-column:1/-1;min-height:230px}
.gcard .hero{position:absolute;top:10%;left:50%;transform:translateX(-50%);font-size:clamp(70px,22vw,104px);line-height:1;filter:drop-shadow(0 8px 6px #0009);animation:bob 2.4s ease-in-out infinite;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.gcard:nth-child(2) .hero{animation-delay:.4s}.gcard:nth-child(3) .hero{animation-delay:.8s}.gcard:nth-child(4) .hero{animation-delay:1.2s}.gcard:nth-child(5) .hero{animation-delay:1.6s}
@keyframes bob{50%{transform:translateX(-50%) translateY(-8px) rotate(-3deg)}}
.gcard .rays{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,#fff1 0 10deg,transparent 10deg 20deg)}
.gcard:first-child .rays{animation:spinr 24s linear infinite;will-change:transform}
@keyframes spinr{to{transform:rotate(360deg)}}
.gcard .en{position:relative;font-size:clamp(17px,5vw,24px);line-height:1.05;color:#fff;text-shadow:0 3px 0 #0008,0 0 12px #0008}
.gcard .kn{position:relative;font-size:14px;color:var(--gold);margin-top:2px;text-shadow:0 2px 0 #000}
.gcard small{position:relative;font-size:11px;color:#fff;opacity:.9;margin-top:4px;background:#0006;border-radius:999px;padding:2px 8px}
.gcard .bdg{position:absolute;top:10px;left:10px;font:12px Bungee,sans-serif;padding:3px 8px;border-radius:8px;background:#ff2a44;color:#fff;box-shadow:0 2px 0 #7a0012}
.c-egypt{background:radial-gradient(circle at 50% 30%,#b56bff,#3a0b7a 60%,#14052e)}
.c-buffalo{background:radial-gradient(circle at 50% 30%,#ffb35a,#b2401a 55%,#3a0c04)}
.c-lucky{background:radial-gradient(circle at 50% 30%,#ff6a7a,#a3091f 55%,#2a0006)}
.c-panda{background:radial-gradient(circle at 50% 30%,#ffc2e4,#c04aa0 55%,#3a1060)}
.c-dragon{background:radial-gradient(circle at 50% 30%,#ffb03a,#c8102e 50%,#3a0306)}
.c-tiger{background:radial-gradient(circle at 50% 30%,#ffd36a,#2f8a3a 50%,#062a0c)}
.c-ocean{background:radial-gradient(circle at 50% 30%,#9af0ff,#1a7ad0 50%,#031a40)}
.c-piggy{background:radial-gradient(circle at 50% 30%,#bff0ff,#3aa0d0 45%,#1f7a2a 75%,#0c3414)}
.foot{font-size:11px;color:#d0c0ef;text-align:center;opacity:.8}
/* game */
.ghead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.back{min-height:44px;padding:0 12px;border-radius:14px;background:#0007;border:2px solid #fff4;font-size:15px}
.gtitle{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 -2px;cursor:default}
.gtitle .gt{font:400 clamp(22px,6.6vw,36px)/1 var(--tfont);font-weight:900;background:linear-gradient(#fff9d0,#ffd34d 45%,#c26a00 70%,#ffe9a0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #0009);white-space:nowrap}
.gtitle .ge{font-size:clamp(26px,8vw,40px);font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;animation:bob2 2s ease-in-out infinite;filter:drop-shadow(0 3px 3px #0008)}
.gtitle .ge:last-child{animation-delay:1s;transform:scaleX(-1)}
@keyframes bob2{50%{translate:0 -5px}}
/* scene */
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,var(--b1) 0%,var(--b2) 38%,var(--b3) 100%);transition:background .4s}
.scimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
.pfx span{will-change:transform}
.scene>svg{position:absolute;inset:0;width:100%;height:100%}
.screen{position:relative;z-index:1}
#game{min-height:100vh;min-height:100svh}
.pfx span{position:absolute;top:0;left:var(--x);font-size:var(--s);opacity:.85;animation:var(--a) var(--d) linear var(--dl) infinite;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
@keyframes fall{from{transform:translateY(-8vh) rotate(0)}to{transform:translateY(108vh) rotate(540deg)}}
@keyframes rise{from{transform:translateY(105vh) translateX(0)}50%{transform:translateY(50vh) translateX(18px)}to{transform:translateY(-8vh) translateX(-10px)}}
@keyframes twk{0%,100%{opacity:.15;transform:translateY(var(--y)) scale(.6)}50%{opacity:1;transform:translateY(var(--y)) scale(1.2)}}
@keyframes flyx{from{transform:translate(-15vw,var(--y))}to{transform:translate(115vw,calc(var(--y) - 30px))}}
.sway{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.sway2{animation:sway 5s ease-in-out infinite reverse;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(6deg)}}
.beam{animation:beam 6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes beam{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.drift{animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(520px)}}
/* stage ornaments */
.orn{position:absolute;top:-22px;z-index:8;font-size:clamp(30px,9vw,44px);font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;filter:drop-shadow(0 4px 3px #0009);animation:sway 3s ease-in-out infinite;transform-origin:50% 0;pointer-events:none}
.orn.l{left:-8px}.orn.r{right:-8px;animation-delay:1.5s}
/* mascot */
body[data-rows="4"] .masc{font-size:clamp(72px,22vw,110px)}body[data-rows="4"] .mzone{min-height:140px;padding-top:34px}
.mzone{position:relative;flex:1;min-height:180px;display:flex;align-items:flex-end;justify-content:center;gap:2vw;padding:40px 0 6px}
.mzone .ground{position:absolute;left:50%;bottom:4px;width:170px;height:22px;margin-left:-85px;border-radius:50%;background:radial-gradient(#0009,transparent 70%)}
.masc{position:relative;font-size:clamp(96px,30vw,150px);line-height:1;cursor:pointer;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;filter:drop-shadow(0 10px 8px #0008);animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 100%;-webkit-tap-highlight-color:transparent}
@keyframes breathe{50%{transform:scale(1.04,.97)}}
.masc.jump{animation:mjump .7s ease-out}
@keyframes mjump{0%{transform:scale(1.1,.85)}35%{transform:translateY(-50px) scale(.95,1.08)}70%{transform:translateY(0) scale(1.08,.9)}100%{transform:none}}
.masc.dance{animation:mdance .45s ease-in-out 6}
@keyframes mdance{25%{transform:translateY(-30px) rotate(-14deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-30px) rotate(14deg)}}
.masc.sad{animation:msad 1.2s ease-in-out}
@keyframes msad{30%,70%{transform:rotate(-8deg) translateY(6px) scale(.96)}}
.props{display:flex;gap:2px;align-items:flex-end;font-size:clamp(32px,10vw,52px);font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;filter:drop-shadow(0 6px 4px #0008)}
.props span{display:inline-block;animation:bob2 2.4s ease-in-out infinite}
.props span:nth-child(2){animation-delay:.6s;font-size:.75em}.props span:nth-child(3){animation-delay:1.2s;font-size:.85em}
.bub{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%) scale(0);transform-origin:50% 100%;background:#fff;color:#3a0b52;border-radius:18px;padding:8px 16px;font-size:clamp(16px,5vw,20px);white-space:nowrap;box-shadow:0 6px 16px #0007;transition:transform .2s cubic-bezier(.3,1.6,.5,1);z-index:3}
.bub::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.bub.on{transform:translateX(-50%) scale(1)}
.jp{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
body.jpon .jp{display:grid}
.plq{border-radius:12px;padding:3px 8px 4px;text-align:center;background:linear-gradient(#1a0b2e,#05010d);border:2px solid var(--gold2);box-shadow:inset 0 0 12px #000;position:relative;overflow:hidden}
.plq b{display:block;font-family:Cinzel,serif;font-weight:900;font-size:11px}
.plq .num{font-size:clamp(12px,3.4vw,17px);color:#fff}
.plq.g{grid-column:1/-1;border-color:var(--gold)}.plq.g b{color:#ff5252;font-size:13px}.plq.g .num{font-size:clamp(20px,6vw,30px);color:var(--gold);text-shadow:0 0 12px #ffb300}
.plq.ma b{color:#d07bff}.plq.mi b{color:#4fb3ff}.plq.mn b{color:#57e07a}
.plq.hitjp{animation:jpflash .25s 10 alternate}
@keyframes jpflash{to{background:#ffd34d}}
.stage{position:relative;padding:10px;border-radius:22px;background:var(--fr);box-shadow:0 10px 30px #000c,0 0 0 3px #0008,inset 0 0 0 2px #fff6}
.banner{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:7;background:linear-gradient(#ff4d5e,#a3091f);border:2px solid var(--gold);border-radius:999px;padding:3px 14px;font-size:13px;white-space:nowrap;box-shadow:0 4px 10px #0008;display:none}
body.fs .banner{display:block}
.win-box{position:relative;display:grid;gap:4px;background:var(--box);border-radius:14px;padding:5px;box-shadow:inset 0 0 20px #000}
.reel,.tcol{position:relative;height:calc(var(--c,70px)*var(--rows,3));overflow:hidden;border-radius:8px;background:var(--reel)}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:14px;z-index:2;pointer-events:none}
.reel::before{top:0;background:linear-gradient(#0008,transparent)}.reel::after{bottom:0;background:linear-gradient(transparent,#0008)}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.cell img,.tc img,.hc img,.pgrid img,.ptable img,.fc img{width:100%;height:100%;display:block;pointer-events:none}
.ptable img{width:46px;height:46px;flex:none}
.cell{height:var(--c,70px);display:grid;place-items:center;padding:4%;position:relative}
.cell img,.tc img{max-width:calc(var(--c,70px)*1.05);margin:auto}
.tc{position:absolute;left:0;right:0;top:0;height:var(--c,70px);display:grid;place-items:center;padding:5%;will-change:transform}
.reel.antic,.tcol.antic{box-shadow:0 0 0 3px #fff3a0,0 0 26px 8px #ff7a00;z-index:2}
.land{animation:land .45s ease-out}
@keyframes land{0%{transform:scale(1.35)}60%{transform:scale(.92)}}
.win-box.dim .cell img,.win-box.dim .tc img{opacity:.32;transition:opacity .25s}
.win-box.dim .hit img{opacity:1;animation:hit .7s ease-in-out infinite}
@keyframes hit{50%{transform:scale(1.1)}}
.cell.hit::after,.tc.hit::after{content:"";position:absolute;inset:2px;border-radius:12px;border:3px solid #ffe680;box-shadow:0 0 10px 2px #ffb300,inset 0 0 12px 2px #ff9d00;animation:fr .45s ease-in-out infinite alternate;will-change:opacity;pointer-events:none}
@keyframes fr{from{opacity:.55}to{opacity:1}}
.tc.pop{transition:transform .28s ease-in,opacity .28s!important;opacity:0!important}
.col{animation:land .4s ease-out}
.col::after,.hc.col::after{content:"";position:absolute;inset:2px;border-radius:12px;border:3px solid #fff;box-shadow:0 0 14px 4px #ffd34d;pointer-events:none}
.hc{position:relative}
#lines{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);pointer-events:none;z-index:3}
#hs{position:absolute;inset:5px;display:none;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(var(--rows,3),var(--c,70px));grid-auto-flow:column;gap:0 4px;z-index:5;background:var(--box);border-radius:10px}
#hs.on{display:grid}
.hc{border-radius:8px;margin:2px;background:radial-gradient(#3a1670,#160629);display:grid;place-items:center;padding:6%;box-shadow:inset 0 0 10px #000}
.hc.roll{animation:hroll .18s infinite alternate}
@keyframes hroll{to{opacity:.6}}
.hc svg{width:100%;height:100%}
.hc.new{animation:land .5s ease-out}

.bw{background:none;border:0;box-shadow:none;animation:none}

.pil::before,.pil::after{content:"";position:absolute;left:3px;right:3px;height:6px;border-radius:3px;background:#5a3002;opacity:.5}.pil::before{top:16px}.pil::after{bottom:16px}

.ctl{position:relative;padding:22px 10px 12px;border-radius:24px 24px 18px 18px;background:linear-gradient(#2a1a5a,#0c0624 60%,#1a0e3a);box-shadow:0 0 0 2px #e0a52a,0 0 0 4px #4a2a02,0 10px 24px #000a,inset 0 2px 0 #fff3}

.stage::after{content:"";position:absolute;inset:-4px;border-radius:26px;box-shadow:0 0 0 3px #fff,0 0 40px 10px #ffd34d;opacity:0;pointer-events:none;transition:opacity .2s}

.bw{position:relative}
.bw::before{content:"";position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(#ffd34d22 0 8deg,transparent 8deg 16deg);animation:spinr 10s linear infinite;z-index:-1;border-radius:50%;mask:radial-gradient(#000 20%,transparent 60%);-webkit-mask:radial-gradient(#000 20%,transparent 60%)}

.winm{position:relative}
/* gamble */
.gtable{display:flex;justify-content:center;gap:6px;margin:6px 0;min-height:30px;font-size:22px}

.pc{position:relative;background:linear-gradient(#0a1a6a,#06104a);display:grid;place-items:center;overflow:hidden}
.pc img{width:88%;height:88%;object-fit:contain}
.pc img.d{opacity:.32;filter:saturate(.4)}
.pfr.spinning .pc:not(.on) img.d{transform:translateY(6%)}
.pc.on{background:linear-gradient(#5aff6a,#18b03a)}
.pc.pop img{animation:ppop .45s cubic-bezier(.3,1.6,.5,1)}@keyframes ppop{from{transform:scale(.2);opacity:0}}
.pc.col{box-shadow:inset 0 0 0 3px #fff36a}
.plock{position:absolute;left:4%;right:4%;top:0;z-index:3;display:flex;flex-direction:column;background:linear-gradient(#2a5affcc,#1a3ad0cc);border:2px solid #7ac8ff;overflow:hidden;transition:height .6s}
.plh{font:900 clamp(6px,1.9cqw,10px)/1.2 'Arial Black',sans-serif;color:#fff;text-align:center;padding:2% 2% 1%;display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:wrap}
.plh img,.plr img{height:1.8em;width:auto}
.plr{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;font:900 clamp(6px,2cqw,11px)/1 'Arial Black',sans-serif;color:#fff;border-top:1px solid #7ac8ff66}
.plr b{display:inline-grid;place-items:center;width:2em;height:2em;border-radius:50%;background:#ffe04a;color:#7a3a00}
.pleft{position:absolute;left:50%;transform:translateX(-50%);top:84.6%;z-index:4;padding:.4em 1.2em .4em .4em;border-radius:99px;background:linear-gradient(#b04aff,#5a0aa0);border:3px solid #ffcc33;color:#fff;font:900 clamp(8px,2.6cqw,14px)/1 'Arial Black',sans-serif;white-space:nowrap;display:flex;align-items:center;gap:.5em}
.pleft i{font-style:normal;display:grid;place-items:center;width:1.8em;height:1.8em;border-radius:50%;background:#ffe04a;color:#5a0aa0}
.pleft.hot{animation:vbump .4s}
.ptot{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:9;text-align:center;padding:4% 8%;background:#000c;border:3px solid #ffcc33;border-radius:16px}
.ptot small{display:block;color:#ffe08a;font:900 12px Jua,sans-serif}.ptot b{font:900 clamp(20px,7cqw,40px)/1.1 'Arial Black',sans-serif;color:#fff36a}
