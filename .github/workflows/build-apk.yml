name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Make Android project
        run: |
          set -e
          A=apkbuild; M=$A/app/src/main
          mkdir -p $M/java/com/taeyul/luckypalace $M/assets/www $M/res/values
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p $M/res/mipmap-$d; cp ic_launcher.png $M/res/mipmap-$d/ic_launcher.png; done
          cp AndroidManifest.xml $M/
          cp MainActivity.java $M/java/com/taeyul/luckypalace/
          cp strings.xml $M/res/values/
          cp index.html games.js audio.js app.js $M/assets/www/
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "https://${OWNER}.github.io/${{ github.event.repository.name }}/" > $M/assets/url.txt
          cat $M/assets/url.txt
          cat > $A/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "LuckyPalace"
          include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.5.2' apply false }" > $A/build.gradle
          printf 'org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\n' > $A/gradle.properties
          cat > $A/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.taeyul.luckypalace'
              compileSdk 34
              defaultConfig {
                  applicationId "com.taeyul.luckypalace"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          find $A -type f | sort
      - name: Build APK
        working-directory: apkbuild
        run: gradle assembleDebug --no-daemon
      - run: cp apkbuild/app/build/outputs/apk/debug/app-debug.apk LuckyPalace.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 럭키 팰리스 APK
          body: 한 번만 설치하면 돼요. 게임 업데이트는 index.html, games.js, audio.js, app.js만 바꾸면 앱에 자동 반영돼요.
          files: LuckyPalace.apk
          make_latest: true
