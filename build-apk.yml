name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'strings.xml'
      - 'ic_launcher.png'
      - 'MainActivity.java'
      - 'taeyul.keystore'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1 Checkout
        uses: actions/checkout@v5
      - name: 2 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: 3 Check files
        run: ls -la
      - name: 4 Make Android project
        run: |
          set -ex
          A=apkbuild; M=$A/app/src/main
          mkdir -p $M/java/com/taeyul/luckypalace $M/assets/www $M/res/values $A/gradle/wrapper
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p $M/res/mipmap-$d; cp ic_launcher.png $M/res/mipmap-$d/ic_launcher.png; done
          cp AndroidManifest.xml $M/
          cp MainActivity.java $M/java/com/taeyul/luckypalace/
          cp strings.xml $M/res/values/
          cp index.html *.js $M/assets/www/
          rm -f $M/assets/www/sim*.js
          cp taeyul.keystore $A/app/
          cp gradlew $A/ && chmod +x $A/gradlew
          cp gradle-wrapper.jar gradle-wrapper.properties $A/gradle/wrapper/
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "https://${OWNER}.github.io/${{ github.event.repository.name }}/" > $M/assets/url.txt
          echo "sdk.dir=$ANDROID_HOME" > $A/local.properties
          cat > $A/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "TaeyulLand"
          include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.5.2' apply false }" > $A/build.gradle
          printf 'org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\n' > $A/gradle.properties
          cat > $A/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.taeyul.luckypalace'
              compileSdk 34
              defaultConfig {
                  applicationId "com.taeyul.luckypalace"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              signingConfigs { fixed { storeFile file('taeyul.keystore'); storePassword 'taeyul1234'; keyAlias 'taeyul'; keyPassword 'taeyul1234' } }
              buildTypes { debug { signingConfig signingConfigs.fixed } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          find $A -type f | sort
      - name: 5 Build APK
        working-directory: apkbuild
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: 6 Copy APK
        run: cp apkbuild/app/build/outputs/apk/debug/app-debug.apk TaeyulLand.apk
      - name: 7 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 태율랜드 APK
          body: 소현이 전용 앱 💕 v3 고정 서명 — 다음부터는 지우지 않고 덮어쓰기 설치 가능. 게임 업데이트는 html·js 파일만 바꾸면 자동 반영돼요.
          files: TaeyulLand.apk
          make_latest: true
